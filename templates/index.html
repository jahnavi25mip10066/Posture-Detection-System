<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Posture Monitor</title>
    <!-- Link to our gorgeous, simple CSS styling -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <!-- Using Inter font for that premium Apple-like feel -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        
        <!-- The header section -->
        <header>
            <h1>Stay Upright.</h1>
            <p>Smart posture detection, made simple.</p>
        </header>
        
        <main>
            <!-- This is where the webcam video is displayed -->
            <div class="video-wrapper">
                <img src="{{ url_for('video_feed') }}" alt="Live Webcam Feed" id="video-stream">
            </div>
            
            <!-- A little hint for the user -->
            <div class="instructions">
                <h3>How it works</h3>
                <p>Ensure your upper body is visible. The system automatically adjusts for low light and partial views.</p>
            </div>
        </main>
        
    </div>
</body>
</html>
