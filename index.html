<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Posture Monitor</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    
    <!-- Official MediaPipe JS Libraries for Client-Side AI -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>
</head>
<body>
    <div class="container">
        <header>
            <h1>Stay Upright.</h1>
            <p>Smart posture detection, running entirely in your browser.</p>
        </header>
        
        <main>
            <div class="video-wrapper">
                <!-- Hidden video element to capture the webcam -->
                <video id="input_video" style="display: none;" playsinline></video>
                <!-- Canvas where we draw the beautiful skeleton and video -->
                <canvas id="output_canvas" width="800" height="600"></canvas>
                <!-- Status overlay -->
                <div id="status-overlay">Waiting for camera...</div>
            </div>
            
            <div class="instructions">
                <h3>Privacy First</h3>
                <p>Everything processes securely on your device. No video is ever sent to the cloud.</p>
            </div>
        </main>
    </div>
    
    <!-- Our custom logic -->
    <script src="script.js"></script>
</body>
</html>
